# Canonical exact-head quality and production-deploy contract.
# Keep the release gates strict. A green run must prove fresh migrations, code quality,
# user journeys, production build/startup, and the same governed Render migration path
# used by the production host.

name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klinikos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Source confidentiality gates
        run: npm run security:check
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Verify MVP journeys against PostgreSQL
        run: npm run test:mvp
      - name: Production build
        run: npm run build
      - name: Post-build confidentiality gates
        run: npm run security:check
      - name: Production startup smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/klinikos-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/klinikos-health.json; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
              cat /tmp/klinikos-health.json
              exit 0
            fi
            sleep 1
          done

          echo "Klinikos production server failed to become healthy."
          cat /tmp/klinikos-start.log
          exit 1

  # The deployment contract is intentionally evaluated under the same Render signal
  # consumed by scripts/render-build.mjs. This verifies the governed additive-migration
  # path instead of accidentally exercising the fail-closed non-Render path.
  deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      RENDER: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_deploy?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_deploy?schema=public
      NEXT_PUBLIC_APP_URL: https://klinikos.io
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klinikos_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Source confidentiality gates
        run: npm run security:check
      - name: Install exactly as the production host installs
        run: npm ci --include=dev --ignore-scripts
      - name: Build exactly as the production host builds
        run: npm run render:build
      - name: Post-build confidentiality gates
        run: npm run security:check
      - name: Start exactly as the production host starts
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/deploy-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/deploy-health.json; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
              cat /tmp/deploy-health.json
              exit 0
            fi
            sleep 1
          done

          echo "The production deployment contract produced a build that never became healthy."
          cat /tmp/deploy-start.log
          exit 1
