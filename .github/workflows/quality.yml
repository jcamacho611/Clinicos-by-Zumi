# Historical incident note: on 2026-08-25, run 32886481649 received no runner and
# recorded zero billable compute. That account-level Actions-capacity incident is not
# current CI truth. By 2026-08-29, Quality run 33273321573 provisioned both jobs, executed
# every step, passed deploy-contract, and reported an application-test failure in verify.
# Therefore exact-head GitHub checks are again required; never reuse the historical
# no-runner explanation for a current failure without fresh job evidence.
#
# Local release proof remains available through:
#   npm run verify:release      full gate — migrations on an empty database, tests,
#                               journeys, production build, startup, health
#   npm run verify:production   read-only check of what is actually deployed
#
# Do not weaken the gates below to make this display green.

name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
    # A real Postgres so migrations can be applied to an empty database on every run.
    # Without this the deploy path was never exercised: nine migrations referenced Prisma
    # model names instead of their mapped table names and could not apply anywhere, and
    # CI stayed green throughout because it never ran them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klinikos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Source confidentiality gates
        run: npm run security:check
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      # The gate that makes a broken deploy path impossible to miss. A migration that
      # cannot apply to an empty database fails here rather than in production.
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Verify MVP journeys against PostgreSQL
        run: npm run test:mvp
      - name: Production build
        run: npm run build
      - name: Post-build confidentiality gates
        run: npm run security:check
      - name: Production startup smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/klinikos-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/klinikos-health.json; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
              cat /tmp/klinikos-health.json
              exit 0
            fi
            sleep 1
          done

          echo "Klinikos production server failed to become healthy."
          cat /tmp/klinikos-start.log
          exit 1

      # Static screenshots do not prove keyboard traversal, focus visibility, mobile
      # obstruction safety, reduced-motion behavior, or action-driven recomposition.
      # Drive the exact-head production build in real Chrome before release evidence is
      # accepted, using the dependency-free DevTools verifier in the repository.
      - name: Verify frontend browser interactions
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/frontend-interactions-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/frontend-interactions-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Klinikos exact-head server never became healthy for browser interaction QA."
            cat /tmp/frontend-interactions-start.log
            exit 1
          fi

          node --experimental-websocket scripts/verify-frontend-browser-interactions.mjs http://127.0.0.1:3000/

      # Reviewable browser evidence belongs in CI so frontend acceptance does not depend
      # on one developer machine, cache state, or a desktop browser policy. The screenshots
      # are generated only from this exact-head production build and uploaded as an artifact.
      - name: Capture frontend release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/frontend-evidence

          PORT=3000 npm start > /tmp/frontend-evidence-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > artifacts/frontend-evidence/health.json; then
              curl --fail --silent --show-error http://127.0.0.1:3000/ > artifacts/frontend-evidence/root.html
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Klinikos exact-head server never became healthy for frontend evidence."
              cat /tmp/frontend-evidence-start.log
              exit 1
            fi
            sleep 1
          done

          CHROME=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$CHROME" ]; then
            echo "No supported headless Chrome/Chromium binary is available on this runner."
            exit 1
          fi

          capture() {
            label="$1"
            size="$2"
            shift 2
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size="$size" \
              "$@" \
              --screenshot="artifacts/frontend-evidence/${label}.png" \
              http://127.0.0.1:3000/
            test -s "artifacts/frontend-evidence/${label}.png"
          }

          capture canonical-1402x1122 1402,1122
          capture desktop-1440x1000 1440,1000
          capture wide-1920x1080 1920,1080
          capture tablet-landscape-1024x900 1024,900
          capture tablet-768x1024 768,1024
          capture mobile-390x844 390,844
          capture reduced-motion-1402x1122 1402,1122 --force-prefers-reduced-motion
          # A 701 CSS-pixel viewport at 2x scale exercises the layout constraints a
          # 1402-pixel-wide visitor encounters at 200% zoom without browser scripting.
          capture zoom-200-1402x1122 701,561 --force-device-scale-factor=2

          printf 'chrome=%s\nhead_sha=%s\n' "$CHROME" "$GITHUB_SHA" > artifacts/frontend-evidence/manifest.txt
          ls -lh artifacts/frontend-evidence

      - name: Upload frontend release evidence
        uses: actions/upload-artifact@v4
        with:
          name: living-universe-release-evidence
          path: artifacts/frontend-evidence
          if-no-files-found: error
          retention-days: 14

  # The deployment contract, run exactly as the production host runs it.
  #
  # `verify` builds with the repository's own scripts and a developer-shaped install, so
  # it cannot see defects that only appear under the host's conditions. Two already
  # reached production that way: NODE_ENV=production prunes devDependencies, which
  # removed tailwindcss and @tailwindcss/postcss and broke the PostCSS plugin
  # resolution; and the canonical command passes --ignore-scripts, which skips every
  # dependency install script as well as this repository's own postinstall.
  #
  # This job therefore hardcodes the canonical Render commands rather than reusing the
  # npm scripts around them. If the deployment contract in render.yaml changes, change it
  # here too — the duplication is the point, because this is the thing being verified.
  deploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_deploy?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_deploy?schema=public
      NEXT_PUBLIC_APP_URL: https://klinikos.io
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klinikos_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Source confidentiality gates
        run: npm run security:check
      # Render's Build Command, verbatim except for the explicit disposable-verification
      # migration token above, which is CI-only and points at this job's disposable DB.
      - name: Install exactly as the production host installs
        run: npm ci --include=dev --ignore-scripts
      - name: Build exactly as the production host builds
        run: npm run render:build
        env:
          # Scoped to this one step, never to the job. A job-level grant would hand every
          # future step here a fail-open migration control.
          #
          # This flag states an intent and grants nothing on its own: render-build.mjs
          # proves the target is an empty, non-managed database before it honours it, and
          # fails the step if it is not. Pointing this job at anything real therefore stops
          # the build rather than migrating it.
          KLINIKOS_ALLOW_MIGRATION_DEPLOY: disposable-verification
      - name: Post-build confidentiality gates
        run: npm run security:check
      # Render's Start Command, verbatim. A build that cannot start is not a deploy.
      - name: Start exactly as the production host starts
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/deploy-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/deploy-health.json; then
              curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/
              cat /tmp/deploy-health.json
              exit 0
            fi
            sleep 1
          done

          echo "The production deployment contract produced a build that never became healthy."
          cat /tmp/deploy-start.log
          exit 1
