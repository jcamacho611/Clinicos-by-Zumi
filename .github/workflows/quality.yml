name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/klinikos_ci?schema=public
    # A real Postgres so migrations can be applied to an empty database on every run.
    # Without this the deploy path was never exercised: nine migrations referenced Prisma
    # model names instead of their mapped table names and could not apply anywhere, and
    # CI stayed green throughout because it never ran them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klinikos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      # The gate that makes a broken deploy path impossible to miss. A migration that
      # cannot apply to an empty database fails here rather than in production.
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      # Applying cleanly is necessary but not sufficient: the schema those migrations
      # build still has to carry the product. This runs MVP Journey 9 against the
      # database CI just created — real repositories, real writes, restart included — so
      # deployability stays a tested property rather than an assumption.
      - name: Verify a fresh deployment works
        run: npm run journey -- scripts/mvp/fresh-deploy-journey.ts
        env:
          AUTH_SECRET: ci-verification-only-secret-not-a-real-secret
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
