version: 2026-08-27.2
status: ACTIVE

canonical_product_authority:
  file: docs/KLINIKOS_MASTER_CANON.md
  status: ACTIVE
  scope:
    - product_definition
    - architecture
    - business_architecture
    - user_experience
    - lifecycle_paths
    - identity_claim_verification_entitlement_authority
    - grid
    - edu
    - clinic_os
    - clinical_convergence
    - intake_and_consent
    - scheduling_and_capacity
    - orders_and_results
    - financial_os_and_rcm
    - integrations
    - zumi_and_memory
    - openai_intelligence_direction
    - security_and_confidentiality
    - legal_product_requirements
    - design
    - commercialization
    - execution_order
  may_be_overridden_by_specialist_docs: false
  may_be_overridden_by_historical_docs: false

implementation_authority:
  question: what_exists_today
  sources:
    - current_code
    - current_database_schema
    - current_migrations
    - current_tests
    - exact_head_verification
    - verified_deployment_evidence
    - verified_runtime_evidence
    - verified_external_connection_evidence
  rule: implementation_evidence_does_not_redefine_product_target

subordinate_specialist_docs:
  authority: SUBORDINATE_ELABORATION
  may_override_master: false
  permitted_uses:
    - protocol_detail
    - domain_detail
    - security_detail
    - integration_detail
    - implementation_detail
    - design_acceptance_detail
    - operational_runbook
    - test_and_verification_evidence
  conflict_rule: MASTER_CANON_WINS_FOR_PRODUCT_DIRECTION

implementation_status_docs:
  authority: EVIDENCE_SNAPSHOT
  may_override_current_code: false
  refresh_required_before_current_claims: true
  examples:
    - docs/FEATURE_STATUS.md
    - docs/EXTERNAL_DEPENDENCY_MATRIX.md
    - docs/PRODUCTION_ENVIRONMENT_TRUTH.md
    - docs/ROUTE_REGISTRY.md
    - docs/ROUTE_REGISTRY_STATUS.md
    - docs/MVP_JOURNEYS.md

provenance_and_evidence_docs:
  authority: PROVENANCE_ONLY
  may_override_master: false
  use_for:
    - rationale
    - expert_input
    - physician_feedback
    - engineer_feedback
    - user_research
    - design_evidence
    - prototype_evidence
    - historical_decisions
    - verification_evidence
    - implementation_history

historical_docs:
  authority: NONE
  may_override_master: false
  use_for:
    - provenance
    - rationale
    - historical_research
  required_interpretation: SUPERSEDED_UNLESS_EXPLICITLY_ABSORBED_BY_MASTER

conflict_rule:
  action:
    - DETERMINE_WHETHER_CONFLICT_IS_IMPLEMENTATION_STATUS_OR_PRODUCT_DIRECTION
    - USE_CURRENT_VERIFIED_IMPLEMENTATION_FOR_WHAT_EXISTS
    - USE_MASTER_CANON_FOR_INSTITUTED_PRODUCT_DIRECTION
    - RECORD_CONFLICT_EXPLICITLY
    - DO_NOT_MERGE_CONFLICTS_SILENTLY

new_discovery_protocol:
  steps:
    - CLASSIFY
    - VERIFY
    - COMPARE_TO_CURRENT_MASTER_CANON
    - ACCEPT_REJECT_OR_MODIFY
    - UPDATE_MASTER_CANON_IF_ACCEPTED
    - UPDATE_IMPLEMENTATION_CONSEQUENCES
    - RETAIN_OLD_VERSION_AS_PROVENANCE
  forbidden_result:
    - NEW_PARALLEL_SUPREME_CANON
    - NEW_PARALLEL_MASTER_CANON
    - NEW_PARALLEL_SOURCE_OF_TRUTH

literal_protected_entry_order:
  authority: docs/KLINIKOS_MASTER_CANON.md#4-canonical-literal-user-experience
  sequence:
    - PROTECTED_ACCESS_TERMS_CONFIDENTIALITY_IP_AIRLOCK
    - ENTER_KLINIKOS
    - LIVING_HOME_WHAT_NEEDS_TO_HAPPEN
    - ZUMI_CONVERSATION
    - INTENT
    - SAFE_VALUE_PREVIEW
    - ACCOUNT_VALUE_TRIGGER
    - UNIVERSAL_IDENTITY
    - PRESERVE_INTENT
    - CLAIM
    - EVIDENCE
    - VERIFICATION
    - ENTITLEMENT
    - AUTHORITY
    - ACTIVE_EXPERIENCE_ENVELOPE
    - ROLE_RELATIONSHIP_OBJECT_SPECIFIC_EXPERIENCE
    - CAPABILITY_ACTIVATION_AS_NEEDED
    - REAL_ACTION
    - FULFILLMENT_OUTCOME_EVIDENCE
    - MEMORY_NEXT_ACTION
    - RETURN_EXPANSION_NETWORK_EFFECT
  abstract_lifecycle_may_override_literal_order: false

relationship_claim_direction:
  sequence:
    - IDENTITY
    - CLAIM
    - EVIDENCE
    - VERIFICATION
    - ENTITLEMENT
    - AUTHORITY
  claim_is_verification: false
  verification_is_entitlement: false
  entitlement_is_tenant_authority: false
  relationship_claim_is_first_class: true
  organization_membership_is_claim_record: false
  existing_user_authority_may_be_mutated_by_claim: false
  email_equality_is_identity_proof: false
  unverified_grid_presence_may_create_protected_tenant_authority: false

prototype_to_production_rule:
  authority: docs/KLINIKOS_MASTER_CANON.md#2-prototype-to-production-law
  required_question: What real identity, relationship, authority, workflow, evidence, financial, network, and data infrastructure would make this statement true?
  screen_copy_is_not_proof_of_implementation: true
  raw_prototype_runtime_is_production_framework: false
  implementation_rule: REBUILD_SEMANTICALLY_IN_CURRENT_PRODUCTION_ARCHITECTURE

design_direction:
  authority: docs/KLINIKOS_MASTER_CANON.md#28-black-label-design-system
  light_mode: MARBLE
  dark_mode: OBSIDIAN
  system_theme_required: true
  visible_theme_flash_allowed: false
  attention_signal: LIVING_EDGE
  living_edge_usage: SCARCE_CONSEQUENTIAL_ATTENTION_ONLY
  route_acceptance:
    - DESKTOP
    - TABLET
    - INTENTIONAL_MOBILE
    - KEYBOARD
    - SCREEN_READER
    - VISIBLE_FOCUS
    - TOUCH_TARGETS_44PX_WHERE_APPLICABLE
    - REDUCED_MOTION
    - ZOOM_200_PERCENT
    - LOADING
    - EMPTY
    - PARTIAL
    - ERROR
    - BLOCKED
    - UNAUTHORIZED
    - PENDING_CONNECTION
    - NO_RESULTS
    - TRUTHFUL_STATE
    - NO_CONFIDENTIAL_BROWSER_LEAKAGE
  modules_may_create_separate_brand_systems: false

openai_direction:
  authority: docs/KLINIKOS_MASTER_CANON.md#10-openai-strategic-intelligence-direction
  primary_zumi_intelligence_platform: OpenAI_ChatGPT_Intelligence
  provider_abstraction_preserved: true
  user_must_select_ai_provider_during_onboarding: false
  model_is_domain_authority: false
  unverified_partner_entitlements_must_not_be_claimed: true
  public_branding_requires_verified_permission: true

confidentiality_rule:
  authority: docs/KLINIKOS_MASTER_CANON.md#25-security-confidentiality-and-ip
  founder_internal_use_equals_external_disclosure_permission: false
  minimum_necessary_disclosure: true
  crown_jewel_external_disclosure_default: DENY
  external_disclosure_requires:
    - AUTHORIZED_RECIPIENT
    - AUTHORIZED_PURPOSE
    - DATA_CLASSIFICATION
    - MINIMUM_NECESSARY
    - CONTRACTUAL_PERMISSION_WHERE_REQUIRED
    - SECURITY_POLICY
    - HUMAN_OR_GOVERNING_POLICY_APPROVAL
  prompt_injection_may_override: false
  customer_request_may_override: false
  investor_request_may_override: false
  vendor_request_may_override: false
  competitor_request_may_override: false
