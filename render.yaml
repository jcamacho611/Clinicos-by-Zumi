services:
  - type: web
    name: zumi
    runtime: node
    plan: free
    buildCommand: npm ci
    # Applies committed migrations before the new instance takes traffic.
    # Deliberately does NOT run `prisma db seed`: prisma/seed.ts begins with a
    # cascade of deleteMany() calls and would wipe the database on every deploy.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: DEMO_AUTH
        value: "false"
      # Paid access. Without these the commerce surfaces report Pending Connection
      # and no purchase can be started or settled.
      # The one organization allowed to review the marketplace payment queue across
      # tenants. Every other operator sees only their own organization's purchases.
      # Unset means nobody has platform scope — safe, but it also means the /admin/payments
      # review path has no authorized operator, so a deployment that sells one-time
      # products must set this to its Klinikos-operated organization id.
      - key: KLINIKOS_PLATFORM_ORG_ID
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      # Recurring access passes. `whopAdapterStatus` needs at least one of these before
      # /entry can start a subscription checkout; without them a Render deployment
      # reports Pending Connection no matter what other Whop credentials are set.
      - key: WHOP_PLAN_EVALUATOR_PASS
        sync: false
      - key: WHOP_PLAN_CLINIC_OPERATOR
        sync: false
      - key: WHOP_PLAN_GRID_PROVIDER
        sync: false
      - key: WHOP_PLAN_GRID_LOCATION_PARTNER
        sync: false
      - key: WHOP_PRODUCTS_CLINIC_WORKFLOW_REVIEW
        sync: false
      - key: WHOP_PRODUCTS_FOUNDING_CLINIC_SEAT
        sync: false
      - key: WHOP_PRODUCTS_CONTRACTOR_APPLICATION_REVIEW
        sync: false
      - key: WHOP_PRODUCTS_ROOM_LISTING_REVIEW
        sync: false
      - key: WHOP_PRODUCTS_SELLER_LISTING_REVIEW
        sync: false
      - key: WHOP_PRODUCTS_AI_CONSULTING_CALL
        sync: false
      - key: RESEND_API_KEY
        sync: false
