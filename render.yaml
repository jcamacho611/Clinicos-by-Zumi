services:
  - type: web
    name: zumi
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --ignore-scripts && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: DEMO_AUTH
        value: "false"
