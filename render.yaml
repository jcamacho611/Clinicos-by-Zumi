services:
  - type: web
    name: zumi
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://zumi.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: DEMO_AUTH
        value: "false"
